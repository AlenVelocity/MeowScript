name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      - name: Tag must match the crate version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)"
          if [ "$tag" != "$version" ]; then
            echo "tag v$tag does not match Cargo.toml version $version"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - run: cargo build --release -p meowscript-cli --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          name="meowscript-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp README.md CHANGELOG.md "dist/$name/"
          cp -r examples "dist/$name/examples"
          case "${{ matrix.target }}" in
            *windows*)
              cp "target/${{ matrix.target }}/release/meowscript.exe" "dist/$name/"
              (cd dist && 7z a -tzip "$name.zip" "$name" > /dev/null)
              ;;
            *)
              cp "target/${{ matrix.target }}/release/meowscript" "dist/$name/"
              (cd dist && tar -czf "$name.tar.gz" "$name")
              ;;
          esac
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: meowscript-${{ matrix.target }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## " v "( |$)" { on = 1; next }
            /^## / && on { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "No changelog entry for $version." > notes.md
          fi
          cat notes.md

      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          name: MeowScript ${{ github.ref_name }}
          body_path: notes.md
          files: dist/*
