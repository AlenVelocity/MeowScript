[package]
name = "meowscript-wasm"
description = "MeowScript compiled to WebAssembly for the browser playground"
version.workspace = true
edition.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
meowscript.workspace = true
wasm-bindgen = "0.2"
js-sys = "0.3"

# Rust emits bulk-memory and non-trapping float-to-int instructions by
# default now; the wasm-opt that wasm-pack downloads must be told to allow them.
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O3", "--enable-bulk-memory", "--enable-nontrapping-float-to-int", "--enable-sign-ext", "--enable-mutable-globals"]
